<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f9ff" />
  <meta name="description" content="GlassNotes — your personal learning workspace" />
  <link rel="manifest" href="/manifest.json" />
  <title>GlassNotes — Your Notes. Anywhere.</title>
  <style>
    body{margin:0;background:#f8faff;color:#121c29;font-family:Arial,sans-serif}#app{min-height:100vh}.loading{min-height:100vh;background:radial-gradient(circle at 50% 20%,#e2ecff,transparent 42%),#f8faff;padding:20px 8%;box-sizing:border-box}.loading nav{display:flex;align-items:center;justify-content:space-between;font-weight:700}.loading .logo{font-size:18px}.loading .pill{background:#14202e;color:#fff;padding:11px 17px;border-radius:12px;font-size:13px}.loading main{max-width:760px;margin:15vh auto;text-align:center}.loading h1{font-size:clamp(42px,12vw,74px);letter-spacing:-3px;margin:0}.loading p{color:#596a83;font-size:17px;line-height:1.6;max-width:540px;margin:22px auto}.loading .card{margin:40px auto;background:#ffffffcc;border:1px solid #e9edf4;border-radius:20px;padding:25px;max-width:450px;box-shadow:0 18px 55px #7c91b533}.loading .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;color:#617087;font-size:12px}.loading .grid b{display:block;color:#1e2b3c;font-size:20px;margin-bottom:7px}
  </style>
</head>
<body>
  <div id="app">
    <div class="loading">
      <nav><span class="logo">▰ &nbsp;GlassNotes</span><span class="pill">Get Started</span></nav>
      <main><h1>Your Notes.<br />Anywhere.</h1><p>A simple, minimalist space to read PDFs, make notes and keep everything backed up securely.</p><div class="card"><strong>Save. Sync. Never Lose.</strong><p>Your personal learning workspace is loading.</p><div class="grid"><span><b>▱</b>Read PDFs</span><span><b>✎</b>Take Notes</span><span><b>☁</b>Back up</span><span><b>▣</b>Anywhere</span></div></div></main>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
